name: CI-CD Pipeline (Full Stack)

on:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Backend (server)
      - name: Setup Node.js (Backend)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: server
        run: npm ci

      - name: Run Backend Tests (Jest)
        working-directory: server
        env:
          CI: true
        run: npm test -- --coverage

      - name: Archive backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/**

      # Frontend (client)
      - name: Setup Node.js (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: client
        run: npm ci

      - name: Run Frontend Linting
        working-directory: client
        run: npm run lint || echo "Lint failed but continuing..."

      - name: Run Frontend Tests (Vitest/Jest)
        working-directory: client
        env:
          CI: true
        run: npm test -- --coverage

      - name: Build Frontend
        working-directory: client
        env:
          CI: true
        run: npm run build

      - name: Archive frontend coverage & build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-artifacts
          path: |
            client/coverage/**
            client/dist/**

  deploy:
    name: Deploy (main only)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-artifacts
          path: ./deploy/

      - name: Download server coverage
        uses: actions/download-artifact@v4
        with:
          name: server-coverage
          path: ./deploy/server-coverage/

      - name: Deploy to staging (placeholder)
        run: |
          echo "Deploying to staging environment..."
          # Add real staging deploy commands here

      - name: Run integration tests (placeholder)
        run: |
          echo "Running integration tests..."
          # Add integration test commands here

      - name: Deploy to production (placeholder)
        run: |
          echo "Deploying to production environment..."
          # Add real production deploy commands here